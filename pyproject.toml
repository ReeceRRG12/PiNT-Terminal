[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pint-terminal"
version = "0.1.1"
description = "PiNT desktop terminal, connection vault and network file tools"
classifiers = ["Development Status :: 4 - Beta"]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "asyncssh>=2.24.1,<3",
    "telnetlib3>=5.0.1,<6",
    "cryptography>=46,<51",
    "pyte>=0.8.2,<0.9",
    "wcwidth>=0.2,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pyftpdlib>=2,<3"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
pint-terminal = "pint_terminal.app:main"

[tool.setuptools.packages.find]
include = ["pint_terminal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
